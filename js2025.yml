  ###########################################################################
  # Highlights
  ###########################################################################

  - key: highlight.solid.html2025
    t: >
      **Solid** використовують лише 10% респондентів, але той факт, що він має найвищу задоволеність *п'ять років поспіль*, має бути достатньою причиною придивитися до того, що він робить.


      Ба більше, творець Solid [Ryan Carniato](https://dev.to/ryansolid) значною мірою відповідальний за популяризацію таких концепцій, як **сигнали**, і він один із найкращих у [поясненні тонкощів](https://dev.to/this-is-learning/javascript-frameworks-heading-into-2026-2hel) інших front-end фреймворків.

  - key: highlight.astro.html2025
    t: >
      **Astro** уважно придивився до того, що робили інші генератори статичних сайтів, узяв найкращі ідеї, а решту відкинув. Результат — фреймворк, який водночас відчувається простим і потужним, і саме тому має найвищий рейтинг задоволеності.


      А після нещодавнього [об'єднання зусиль із Cloudflare](https://blog.cloudflare.com/astro-joins-cloudflare/) цікаво уявити, що команда Astro покаже нам далі!

  - key: highlight.elysia.html2025
    t: >
      Back-end фреймворків існує чимало, але **Elysia** вирізняється як єдиний, побудований поверх [Bun](https://bun.com/).


      Робити ставку на цілком новий рантайм ризиковано, але з огляду на дедалі більшу популярність самого Bun схоже, що ця ставка може окупитися. Принаймні це точно виявляється цікавим експериментом!

  - key: highlight.bun_test.html2025
    t: >
      Після років сподівань на більш уніфікований набір інструментів схоже, що JavaScript-розробники нарешті починають отримувати бажане.


      **Bun test** — лише один приклад тестового раннера, вбудованого в рантайм: [Node](https://nodejs.org/api/test.html) і [Deno](https://docs.deno.com/runtime/fundamentals/testing/) пропонують власні відповідники.

  - key: highlight.rolldown.html2025
    t: >
      Хоча команду **Vite** знають переважно, власне, за Vite, вона також тихцем розробляла **Rolldown** — швидший бандлер на основі Rust.


      А тепер, коли [Vite сам використовує Rolldown](https://vite.dev/blog/announcing-vite8-beta), проєкт, безсумнівно, посяде центральне місце в екосистемі інструментів збірки.

