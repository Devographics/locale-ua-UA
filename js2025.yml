  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.js2025.daniel_roe
    t: >
      <span class="first-line">TypeScript переміг.</span>


      Не як бандлер &ndash; а як мова. Deno і Bun підтримують(-ували) його вже давно. А тепер завдяки зрізанню типів ви можете писати ним нативно у стабільних версіях Node.js. Якщо типи як коментарі приживуться, ви зможете писати ним навіть у браузері.


      …і настав день Vite. Цього року ми побачили, як завантаження Vite перевершили показники webpack. А поряд із цим різко зросло використання Vitest. Схоже, саме час перейти на новий набір інструментів Vite, і 2026-й обіцяє стати роком, коли це станеться, &ndash; зі стабільним релізом Rolldown, що живитиме новий, швидший Vite, а також з обіцянкою універсального «Vite+».


      Наші інструменти кращі, ніж будь-коли. Але екзистенційне питання, яке всі ми ставимо, зовсім інше: а що з ШІ?


      ШІ готовий змінити те, як ми споживаємо документацію, пишемо код, ухвалюємо архітектурні рішення тощо. Компанії ставлять усе на нові моделі розробки. Для переважної більшості з нас агенти для програмування змінюють те, як ми взаємодіємо зі своїм кодом.


      Чи це добре?


      Схоже, наприкінці 2025 року трохи менше ніж 30% коду було згенеровано ШІ. Cursor і Zed стрімко набирають популярності, навіть якщо їм ще далеко до того, щоб скинути VSCode з трону найуживанішого IDE. А підходи на основі агентів, як-от Claude, Gemini і Copilot, швидко зростають.


      Для тих із нас, хто є розробниками, розуміння того, що таке «добре», буде важливішим, ніж будь-коли, хоч би якими інструментами ми користувалися. Важливіше буде стежити за новими можливостями мови. Так само як і знати, на яких бібліотеках будувати, замість того щоб вайб-кодити все з нуля.


      Уже зараз можна підняти новий проєкт за день &ndash; або легко мігрувати наявний. Це виклик для авторів фреймворків і бібліотек. Ми маємо подбати, щоб наші інструменти й далі служили розробникам. Ми не можемо покладатися на інерцію.

  - key: conclusion.js2025.daniel_roe.bio
    t: Мейнтейнер опенсорсу та засновник, очолює основну команду Nuxt.

  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.js2025
    t: |
      Опитування "Cтан JavaScript 2025" тривало з 24 вересня до 10 листопада 2025 року та зібрало 13002 відповіді. Результати були опубліковані 3 лютого 2026 року. Опитування проводив [Devographics](https://devographics.com/). 

      Логотип і футболку "Стан JavaScript" розробив [Christopher Kirk-Nielsen](http://chriskirknielsen.com/). 

      ### Цілі опитування 

      Це опитування було створено для визначення майбутніх тенденцій в екосистемі веброзробки, щоб допомогти розробникам здійснити вибір з-поміж наявних технологій. 

      Так опитування зосереджено більше на передбаченні того, що станеться протягом наступних кількох років, ніж на аналізі того, що популярно саме зараз, — ось чому деякі функції чи технології іноді можуть не згадуватися попри широке впровадження. 

      Його також слід сприймати як **знімок певної підмножини розробників у певний момент часу**, а не промовистий опис від імені всієї екосистеми. 

      ### Розробка опитування 

      Опитування було розроблено частково на основі торішнього опитування з відкритим періодом для зворотного зв'язку, під час якого план опитування обговорювався [на платформі GitHub](https://github.com/Devographics/surveys/issues/255). 

      Усі запитання опитування були необов'язковими. 

      ### Аудиторія опитування 

      Опитування було повністю відкрите та доступне онлайн, респонденти жодним чином не відфільтровувалися та не відбиралися. Респонденти складалися здебільшого з учасників минулих опитувань (сповіщених електронною поштою за спеціальним списком розсилання) та тих, хто прийшов через соціальні мережі. 

      Зауважте, що фреймворки, бібліотеки тощо могли вільно заохочувати свою аудиторію до участі в опитуванні, і деякі з них скористалися цим за допомогою банерів, твітів або в інший спосіб. Детальний розподіл джерел трафіку включено в діаграму "Джерела". 

