      ## Стан React 2025

  ###########################################################################
  # Takeaways
  ###########################################################################

  - key: features.js_new_features.takeaway.js2025
    t: >
      Хоч **Temporal** усе ще очолює рейтинг, рівень зацікавлення знизився за рік, що цілком логічно, адже він почав перехід від теоретичної пропозиції до реалізації у Firefox.

  - key: features.top_currently_missing_from_js.takeaway.js2025
    t: >
      У топ-5 немає змін, але варто зазначити, що інтерес до **Signals** трохи знизився, як порівняти з минулим роком.

  - key: features.native_types_proposal.takeaway.js2025
    t: >
      Хоч 32% респондентів і сподіваються на **динамічні типи** у JavaScript, та якщо офіційне підтримання типів колись з’явиться, то набагато ймовірніше як **анотації подібно до TypeScript**, які посіли перше місце.

  - key: features.js_pace_of_change.takeaway.js2025
    t: >
      Метою цього питання було приблизно уявити, наскільки добре респонденти встигають за новими функціями, і результати показують, що більшості з нас складно навіть дізнаватися про них — навіть не пробувати. Сподіваємося, результати цього опитування допоможуть із цим!

  - key: features.reading_list.takeaway.js2025
    t: >
      **Список читання** дає респондентам змогу дізнаватися більше про конкретні пункти після проходження опитування, і цього року, крім ручного додавання, почало функціонувати автоматичне додавання на основі відповідей. 

      Ця зміна призвела до того, що список став значно більш орієнтованим на бібліотеки, як порівняти з попередніми роками, коли в ньому було більше функцій мови.

  - key: libraries.all_tools_experience.takeaway.js2025
    t: >
      **Vite** уже кілька років є найбільш улюбленою бібліотекою, але тепер вона обійшла **React** і стала також другою за рівнем використання, і, схоже, готова посісти перше місце вже наступного року. 


      Водночас **Next.js** є 13-м найулюбленішим і 5-тим найменш улюбленим проєктом, а ще зібрав найбільше коментарів загалом — що демонструє, наскільки поляризованим може бути ставлення до фреймворку.

  - key: libraries.tools_arrows.takeaway.js2025
    t: >
      JavaScript-бібліотеки зазвичай демонструють "бумеранг-патерн" із часом: на початковому етапі позитивні відгуки (лінія рухається вправо) сприяють росту використання (лінія стрімко підіймається), але користувачі стикаються із що раз неприємнішими крайніми випадками та проблемами під час реального впровадження, через що думки стають негативнішими (лінія повертає вліво). 


      Це означає, що будь-який проєкт, який рухається вправо (як-от **Vue.js**) або навіть просто залишається вертикальним (як-от **Astro**), заслуговує на увагу!

  - key: libraries.tier_list.takeaway.js2025
    t: >
      Завдяки рівню вдоволеності понад 90%, **Hono** і **Bun** цього року цілком заслужено потрапляють до S-tier.

  - key: libraries.tools_ratios_over_time.takeaway.js2025
    t: >
      Нагороду за найбільший приріст використання отримують **Vitest** і **Playwright**, які додали **14** відсоткових пунктів за рік. 


      Водночас **Rolldown** показав величезне зростання впізнаваності назви — з **33%** до **51%**. А якщо дивитися на вдоволеність, то **Next.js** зазнав найбільшого падіння — з **68%** до **55%**. 


      Також цікаво бачити, що і **Preact**, і **React** значно краще оцінені респондентами, які направду ними користувалися, ніж тими, хто лише чув про них (як показано у вкладці "Схвалення").

  - key: libraries.scatterplot_overview.takeaway.js2025
    t: >
      Завдяки додаванню цього року серверних фреймворків, **Express** приєднався до **Vite**, **React** і **Jest** у бажаному верхньому правому квадранті. Але **Vue.js**, **Storybook** і **Vitest** теж зовсім поруч!

  # front_end_frameworks

  - key: front_end_frameworks.front_end_frameworks_ratios.takeaway.js2025
    t: >
      Попри всі розмови про постійні потрясіння у front-end екосистемі, за минулий рік усе було напрочуд стабільно: у рейтингу використання не змінилося нічого, окрім того, що **Alpine.js** і **HTMX** помінялися місцями.


      Те саме стосується задоволеності — за винятком **Qwik**, який далі втрачає позиції.


      Ще одне місце, де помітний брак нового ажіотажу, — вкладка «Зацікавленість»: жоден фреймворк, окрім **Solid** і **Preact**, не додав позицій від минулого року.

  - key: front_end_frameworks.front_end_frameworks_others.takeaway.js2025
    t: Якщо не брати до уваги **Astro**, який не зовсім належить до категорії front-end фреймворків, і **Ember**, який існує вже чимало часу, то найцікавішим новачком тут є **Ripple**, що взявся за нелегку справу бути новеньким у front-end кварталі.

  - key: front_end_frameworks.front_end_frameworks_cardinalities.takeaway.js2025
    t: Пересічний респондент за всю кар'єру скористався лише **2.6** різними front-end фреймворками — і це знову показує, що образ вигорілого веброзробника, який щомісяця перестрибує з фреймворка на фреймворк, уже не зовсім відповідає дійсності.

  - key: front_end_frameworks.front_end_frameworks_happiness.takeaway.js2025
    t: Попри незначний спад, задоволеність front-end розробкою роками лишається напрочуд стабільною.

  - key: front_end_frameworks.front_end_frameworks_pain_points.takeaway.js2025
    t: >
      Бути домінантним фреймворком означає ще й очолювати список того, з чим front-end розробники мають найбільше труднощів, — і це **React**.


      Серед інших повторюваних проблем — низька продуктивність, керування станом і просто-таки надмірна складність сучасної front-end екосистеми.

  # meta_frameworks

  - key: meta_frameworks.meta_frameworks_ratios.takeaway.js2025
    t: >
      **Next.js** далі набирає обертів і домінує в категорії метафреймворків, але парадоксально, що водночас він втрачає задоволеність. Це недобрий знак: розрив за цим показником із лідером **Astro** сягнув уже **39%**.


      А один погляд на діаграму обізнаності показує, наскільки небезпечним конкурентом насправді є Astro: від практично невідомого до серйозного претендента за якихось кілька років.

  - key: meta_frameworks.meta_frameworks_others.takeaway.js2025
    t: >
      Багато респондентів запитували, чому серед варіантів опитування немає **TanStack Start**. Причина проста: на момент запуску опитування фреймворк ще не вийшов із бети!


      На щастя, респонденти змогли виправити це упущення, згадавши проєкт у полі «інші метафреймворки», — чіткий сигнал, що наступного року TanStack Start дуже потужно ввійде до «офіційного» рейтингу.

  - key: meta_frameworks.meta_frameworks_cardinalities.takeaway.js2025
    t: Респонденти користувалися не такою вже й великою кількістю різних метафреймворків, чого й слід очікувати в категорії, де досі домінують одне-два рішення.

  - key: meta_frameworks.meta_frameworks_happiness.takeaway.js2025
    t: Буде цікаво побачити, чи спадна задоволеність Next.js зрештою обернеться зниженням загальної задоволеності, але поки що принаймні цього не видно.

  - key: meta_frameworks.meta_frameworks_pain_points.takeaway.js2025
    t: >
      За своєю природою метафреймворки перекривають розрив між клієнтом і сервером, а це породжує чимало складних проблем.


      І хоча **Next.js** пропонує чимало способів їх розв'язати, зворотний бік усієї цієї потужності в тому, що крива навчання та загальний досвід розробника часом страждають.

  # back_end_frameworks

  - key: back_end_frameworks.back_end_frameworks_ratios.takeaway.js2025
    t: >
      Після трьох років відсутності в опитуванні саме час було знову придивитися до back-end фреймворків. І тут без несподіванок: **Express** досі лідирує за використанням, навіть якщо **Nest** просувається доволі жваво.


      Але цікавіше стає на вкладці «Задоволеність», де всі три лідери (**Hono**, **Nitro** та **ElysiaJS**) — новачки, що робить цю категорію однією з найцікавіших для спостереження в найближчі роки.

  - key: back_end_frameworks.back_end_frameworks_others.takeaway.js2025
    t: "**oRPC** пропонує типобезпечні API — вагома перевага порівняно з традиційними back-end рішеннями, створеними ще до великого повороту в бік TypeScript."

  - key: back_end_frameworks.back_end_frameworks_cardinalities.takeaway.js2025
    t: "Респонденти зазвичай користуються порівняно небагатьма back-end фреймворками — можливо, саме тому **Express** лишається таким домінантним: щойно ви обрали back-end, ви навряд чи докладатимете зусиль, щоб випробувати нові варіанти."

  - key: back_end_frameworks.back_end_frameworks_pain_points.takeaway.js2025
    t: >
      Хоча **Express** досі широко використовується через *15 років* після першого релізу, дехто вже сподівається, що back-end екосистема перейде до сучасніших альтернатив.


      Особливо це стосується типобезпечних, сумісних із TypeScript API — того, для чого цей поважний фреймворк ніколи не призначався.

  # testing

  - key: testing.testing_ratios.takeaway.js2025
    t: >
      **Jest** довго втішався зручним місцем найуживанішого інструмента тестування, але **Vitest** піднімається рейтингом так швидко, що не дивно було б побачити, як він обжене Jest уже наступного року — надто з огляду на спадну задоволеність Jest.


      Тим часом **Storybook** — цікавий приклад проєкту, який щосили намагається зарадити невдоволенню своїх користувачів. Задоволеність усе ще трохи нижча, ніж торік, але темп спаду сповільнився, і незабаром справи можуть піти вгору.

  - key: testing.testing_others.takeaway.js2025
    t: Хоча тестовий раннер **Deno** не потрапив до основних варіантів опитування, він посів перше місце серед згадок у вільній формі.

  - key: testing.testing_cardinalities.takeaway.js2025
    t: Якщо в інших категоріях досі трималося на рівні 1–2 використаних інструментів, то в тестуванні респонденти назвали в середньому аж **4.4** — ознака того, що люди, можливо, досі шукають той самий ідеальний тестовий раннер і що в цій царині ще далеко не все усталилося.

  - key: testing.testing_happiness.takeaway.js2025
    t: Задоволеність лишається стабільною, з незначним зростанням за останні три роки.

  - key: testing.testing_pain_points.takeaway.js2025
    t: "**Мокінг** лишається головним болем розробників, а **конфігурація** й налаштування — одразу за ним."

  # build_tools

  - key: build_tools.build_tools_ratios.takeaway.js2025
    t: >
      Я справді думав, що цього року **Vite** нарешті обжене **webpack** і посяде місце найуживанішого інструмента збірки, але, схоже, доведеться зачекати ще рік.


      **Turbopack** теж показує неабиякий поступ за використанням — безсумнівно, завдяки тому, що постачається разом із Next.js. Утім, як і в Next.js, його показник задоволеності доволі тривожний.


      **Rolldown**, навпаки, додав у задоволеності, а ще посідає перше місце за зацікавленістю.


      Нарешті, **Bun** тримається доволі добре в усіх категоріях, що є неабияким досягненням для такого нового й амбітного проєкту.

  - key: build_tools.build_tools_others.takeaway.js2025
    t: Респонденти знову згадували **Deno** — вагомий аргумент, щоб додати його до основних варіантів опитування у 2026 році.

  - key: build_tools.build_tools_cardinalities.takeaway.js2025
    t: Як і з інструментами тестування, респонденти випробували чимало різних інструментів збірки. Побачимо, чи зробить **Vite** це надбанням минулого.

  - key: build_tools.build_tools_happiness.takeaway.js2025
    t: Задоволеність інструментами збірки лишається стабільною.

  - key: build_tools.build_tools_pain_points.takeaway.js2025
    t: Хоча Vite безумовно поліпшив ситуацію, **конфігурація** й налаштування лишаються найгострішою проблемою інструментів збірки.

    # other_tools

  - key: other_tools.libraries.takeaway.js2025
    t: "**Zod** сильно виріс за рік. А оскільки чимало представлених тут бібліотек зосереджені на роботі з датами, буде цікаво побачити, як ця діаграма зміниться, коли **Temporal** здобуде кращу підтримку в браузерах."

  - key: other_tools.graphics_animation.takeaway.js2025
    t: Торік **Chart.js** був результатом із поля для вільної відповіді, а цього року, потрапивши до офіційних варіантів, злетів одразу на перше місце.

  - key: other_tools.utilities.takeaway.js2025
    t: Схоже, нині кожен JavaScript-розробник, який себе поважає, користується **ESLint** і **Prettier**.

  - key: other_tools.runtimes.takeaway.js2025
    t: Те, що **Node.js** і браузери посідають верхні місця, не надто дивує, але третє місце **Bun** — приємний знак зростання проєкту.

  - key: other_tools.hosting.takeaway.js2025
    t: Попри подеколи неоднозначну репутацію компанії, **Vercel** зробив разючу роботу, утвердившись як серйозний варіант хостингу, поступаючись лише **AWS**.

  - key: other_tools.edge_runtimes.takeaway.js2025
    t: "**Cloudflare** був п'ятим у діаграмі хостингу, а тут посідає місце одразу за **AWS Lambda**, що робить його серйозним претендентом в обох сферах."

  - key: other_tools.text_editors.takeaway.js2025
    t: "**VS Code** давно домінує серед текстових редакторів, але **Cursor** якимось чином зумів випередити всіх інших конкурентів завдяки своїй обіцянці програмування з ШІ."

  - key: other_tools.mobile_desktop.takeaway.js2025
    t: "**React Native** тут лідирує, але за **Expo** й **Tauri** теж варто стежити!"

  - key: other_tools.monorepo_tools.takeaway.js2025
    t: "**pnpm** — беззаперечний лідер у категорії монорепозиторіїв."

  - key: other_tools.non_js_languages.takeaway.js2025
    t: Коли ми не пишемо на JavaScript, більшість із нас звертається до **Python** і **PHP**.

  - key: other_tools.non_js_languages_features_top_features.takeaway.js2025
    t: >
      Цього року ми також запитали респондентів, які *можливості* вони хотіли б бачити впровадженими в JavaScript, із зазначенням мови, з якої ця можливість походить.


      Друга вкладка показує, які мови траплялися найчастіше. І хоча **Rust** був лише 7-ю за використанням мовою в попередній діаграмі «Мови, відмінні від JavaScript», тут він вийшов на перше місце — свідчення його непропорційно великого впливу на екосистему JavaScript.

  # usage

  - key: usage.js_ts_balance.takeaway.js2025
    t: Частка розробників, які пишуть увесь свій код на TypeScript, продовжує зростати і незабаром може становити більшість респондентів.

  - key: usage.compiled_code_balance.takeaway.js2025
    t: Природний наслідок написання типізованого коду (принаймні сьогодні) — залежність від етапу збірки, і це стосується переважної більшості з нас.

  - key: usage.build_step_advantages.takeaway.js2025
    t: Якщо ми *справді* хочемо уявити майбутнє без етапу збірки, першим кроком, безсумнівно, має стати нативна підтримка типів у JavaScript.

  - key: usage.ai_generated_code_balance.takeaway.js2025
    t: "Хоча респонденти поки що не створюють більшість свого коду за допомогою ШІ, баланс швидко зміщується: частка коду, що є результатом роботи ШІ, зросла за рік із 20% до 29%."

  - key: usage.what_do_you_use_js_for.takeaway.js2025
    t: Попри дедалі більшу кількість сценаріїв застосування JavaScript, front-end розробка наразі лишається найпоширенішою причиною користуватися цією мовою.

  - key: usage.industry_sector.takeaway.js2025
    t: З огляду на те, що опитування зосереджене на нових тенденціях і ранніх можливостях, цілком логічно, що його найбільшу аудиторію становлять розробники, які створюють інструменти та продукти для інших програмістів.

  - key: usage.js_app_patterns.takeaway.js2025
    t: Сучасні JavaScript-фреймворки нині підтримують цілу низку різних режимів рендерингу, але виявляється, що найпростіші з них досі лишаються найпопулярнішими.

  - key: usage.top_js_pain_points.takeaway.js2025
    t: Тепер ми маємо майже всі потрібні інструменти; складність у тому, щоб знати, як правильно ними користуватися.

  - key: usage.state_of_the_web_happiness.takeaway.js2025
    t: Задоволеність знову стабільна.

  - key: usage.state_of_js_happiness.takeaway.js2025
    t: Рівень задоволеності знову лишається незмінним.

  # resources

  - key: resources.courses.takeaway.js2025
    t: Завжди цікаво спостерігати, як незалежні розробники на кшталт **Wes Bos** і **Fireship** зуміли перетворити своїх підписників на здатність конкурувати з набагато більшими гравцями, як-от **Udemy** чи **O'Reilly**.

  - key: resources.newsletters.takeaway.js2025
    t: Розсилкам бракує вбудованих механізмів поширення, які є в соцмережах, тож нарощувати їх доволі важко. Це пояснює, чому давні гравці, як-от **JavaScript Weekly** і **CSS-Tricks**, досі очолюють рейтинг.

  - key: resources.podcasts.takeaway.js2025
    t: Хоча межа між подкастами та відеоконтентом дедалі більше розмивається, **Syntax** утримує своє місце улюбленого аудіоджерела респондентів на теми програмування.

  - key: resources.video_creators.takeaway.js2025
    t: Хоча ці рейтинги значною мірою залежать від того, чи поділилися відеотворці опитуванням зі своєю аудиторією, **Fireship**, **Theo** і **The Primeagen**, схоже, міцно закріпилися як трійка головних постатей програмістського YouTube.

  - key: resources.people.takeaway.js2025
    t: Хоча **Midudev** має власну велику відеоаудиторію, а інші «відомі» розробники асоціюються з успішними опенсорс-проєктами, варто зазначити, що заслужений успіх **Josh Comeau** майже цілком зумовлений якістю його чудового блогу — відсилання до більш старосвітського способу створювати навчальний контент онлайн.

  - key: resources.other_surveys.takeaway.js2025
    t: Хоча заповнення надто великої кількості онлайн-опитувань, безсумнівно, може призвести до горезвісної «втоми від опитувань» (зверніться до лікаря!), у помірних дозах вони лишаються чудовим інструментом, щоб дізнаватися про екосистему.

