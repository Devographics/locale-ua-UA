  # creators
  - key: creators.heading
    t: Творці, яких ми підтримуємо

  - key: creators.description
    t: >
      Наші опитування можливі лише завдяки постійній підтримці спільноти розробників, тож цілком природно, що ми й самі віддаємо щось навзаєм, коли можемо.


      Ось деякі з чудових творців контенту та організацій, яких ми підтримуємо фінансово в обмін на поширення інформації про опитування.

  - key: creators.stephanie_walter.description
    t: Stéphanie Walter — досвідчена UX-дослідниця, дизайнерка й авторка, яка живе в Люксембурзі та має хист робити складні теми зрозумілими й доступними.

  - key: creators.afor_digital.description
    t: Afor — ключова постать в іспаномовній спільноті стримерів веброзробки, а її талант робити контент про програмування захопливим приніс їй заслужений успіх.

  - key: creators.shruti_kapoor.description
    t: Блогінг, відео на YouTube, виступи на конференціях — і до того ж чудова людина. Shruti вже чималий час лишається однією з опор екосистеми React.

  - key: creators.codebar.description
    t: Codebar — дивовижна організація, яка проводить воркшопи, що зазвичай коштували б тисячі доларів, і викладає їх у безкоштовний онлайн-доступ, щоб будувати більш інклюзивну спільноту розробників.

