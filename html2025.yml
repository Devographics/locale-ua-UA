locale: ua-UA
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: Видання 2025 року щорічного опитування про найновіші тенденції в екосистемі HTML.

  - key: general.html2025.survey_intro
    t: |
      У 2023 році, коли опитування "Стан JS" та "Стан CSS" проводилися вже кілька років, ми усвідомили, що чогось бракує: а як же технологія, яка поєднує все це воєдино? 

      Адже HTML сьогодні далеко поза тегами й атрибутами — він охоплює API для динамічних оновлень, збагачені вбудовані елементи, підказки швидкодії, шаблони й компоненти та багато іншого. 

      Перше опитування "Стан HTML", очолене суперзіркою вебу [Lea Verou](https://lea.verou.me/), побило всі попередні рекорди для нового опитування, зібравши 21 тисячу респондентів, і запровадило нові UI-парадигми, що поліпшили всі наступні опитування. 

      Цього року, з Lea знову біля керма, ми додали ✨35 нових функцій✨ та започаткували два нові розділи: **Графіка та мультимедіа** і **Швидкодія**. 

      Ба більше, як і в попередніх хвилях, цьогорічні результати братимуться до уваги розробниками браузерів під час формування своїх "дорожніх мап", тож участь в опитуванні може допомогти сформувати майбутнє вебу! 

      Готові? На старт, увага, руш!

  - key: features.features_intro_html2025
    aliasFor: features.features_intro_html2024

  - key: introduction.html2025
    t: >
      Якщо ви хочете уявити, наскільки потужною стала вебплатформа за останні кілька років, достатньо поглянути на перелік категорій, охоплених цим опитуванням.


      Форми, графіка, функції продуктивності, способи взаємодії з різними системними та апаратними API, доступність… Дивно, що комусь узагалі вдається за всім цим стежити!


      На щастя, принаймні одна людина встигає: [Lea Verou](https://lea.verou.me/), яка після розробки первинної версії опитування у 2023 році знову долучилася до нас цього року, щоб її оновити.


      І разом ми цього року зосередилися, зокрема, на аналізі величезної кількості відповідей у вільній формі, зібраних щодо різних проблемних сфер.


      Тепер ви зможете глибше зануритися в категоризовані дані, а також отримати доступ до оригінальних відповідей респондентів (і шукати в них).


      Якщо це нічого більше не дасть, то принаймні допоможе усвідомити, що ми всі в одному човні — з однаковими розчаруваннями, але й з однаковими сподіваннями!


      <span class="conclusion__byline">– Sacha Greif</span>

  - key: faq.survey_design_html2025
    t: Як було розроблено це опитування?
  - key: faq.survey_design_html2025.description
    t: >
      Опитування було розроблено унаслідок [відкритого процесу розробки](https://github.com/Devographics/surveys/issues/253) із залученням постачальників браузерів і спільноти веброзробки.

  - key: faq.results_released_html2025
    t: Коли будуть опубліковані результати?
  - key: faq.results_released_html2025.description
    t: Опитування триватиме з 15 липня до 15 серпня 2025 року, і його результати будуть опубліковані орієнтовно 15 вересня 2025 року.

  ###########################################################################
  # Figures
  ###########################################################################

  - key: figure.figure_lazy_loading_usage.html2025
    t: Частка респондентів, які використовували **відкладене завантаження** — найуживанішу функцію серед тих, що мають статус Baseline «Newly Available».

  - key: figure.figure_content_security_usage.html2025
    t: Найбільше річне зростання використання — у **Content-Security Policy**.

  - key: figure.figure_forms_features.html2025
    t: Кількість коментарів до функції, яку коментували найбільше, — **datalist**.

  ###########################################################################
  # Highlights
  ###########################################################################

  - key: highlight.customizable_select.html2025
    t: >
      **Customizable Select** наразі, можливо, не має широкої підтримки, але про цю функцію варто знати. Хоча її використовують лише **7,1%** респондентів, **89%** розробників, які *справді* з нею працювали, повідомляють про позитивний досвід.


      А з огляду на те, що елемент `<select/>` завжди був складним для стилізації, можливість нарешті підлаштувати його під свої потреби без JavaScript-хаків — приємне покращення!

  - key: highlight.jpeg_xl.html2025
    t: >
      Після фіаско з вимовою «JIF/GIF» і заплутано названого «PNG» («пі-ен-джі»? «пінг»?) той, хто відповідає за назви форматів зображень, цього разу вирішив не мудрувати: узяти вже популярний JPEG і додати до нього «XL», щоб звучало крутіше.


      Але не більше за розміром: усупереч назві, зображення JPEG XL насправді *менші* за нудний старий JPEG — і при цьому якимось чином лишаються сумісними з ним. Не питайте мене, як це працює.

  - key: highlight.hidden_until_found.html2025
    t: >
      А ви знали, що браузери тепер уміють гратися в хованки? Атрибут `hidden="until-found"` дає змогу приховати елемент, доки користувач його не викличе — наприклад, клацнувши якірне посилання, що вказує на нього.


      Наразі ця функція точно перебуває у «прихованому» стані: **79,4%** респондентів навіть не чули про неї раніше. А підтримування в браузерах усе ще обмежене (це про тебе, Safari!). Але щойно сумісність покращиться, вона цілком може стати вартою місця у вашому арсеналі.

  - key: highlight.popover_api.html2025
    t: "**Popover API** цього року отримав статус «Newly Available», тобто тепер він підтримується в усіх чотирьох основних браузерах. А отже, це ідеальний час дізнатися, як він допоможе позбутися костильного JavaScript-коду й замінити його приємним декларативним API!"

  - key: highlight.blocking_render.html2025
    t: >
      Тим із нас, кому не байдужий FOUC (Flash of Unstyled Content) і контроль над тим, як завантажуються сайти, буде приємно дізнатися про `blocking="render"`. Як випливає з назви, цей атрибут змушує теги `<link>`, `<script>` чи `<style>` блокувати рендеринг сторінки, доки вони повністю не завантажаться.


      Підтримування в браузерах іще не на висоті, але це точно те, що зробить UX завантаження вебу значно плавнішим, щойно стане широко доступним.

  - key: highlight.element_internals.html2025
    t: >
      Якщо ви пишете вебкомпоненти, вам напевно часто потрібно було задати власні псевдокласи, типові параметри ARIA або змусити компонент поводитися як звичайний елемент форми?


      **ElementInternals** робить усе це — і навіть більше! А найкраще те, що він Widely Available й підтримується всіма браузерами з 2023 року!

  - key: highlight.payment_request_api.html2025
    t: >
      «Мій улюблений рецепт морквяного торта? Звісно, розкажу! Але спершу — чи можу я зацікавити вас новим матрацом? А може, взуттям?»


      Реклама може здаватися невіддільною частиною вебу, надто коли ви намагаєтеся спекти щось нове. Але **PaymentRequest API** може стати першим кроком до того, щоб вбудовані в браузер мікроплатежі стали реальністю. І вже самого цього досить, щоб за ним стежити.

  - key: highlight.search_element.html2025
    t: >
      Елемент `<search>` — одна з тих легких перемог, які майже нічого не варті, щоб додати їх до свого списку найкращих практик. Крок 1: використовуйте його, щоб позначити будь-яке поле пошуку у ваших застосунках. Крок 2: власне, це й усе!


      А тепер, коли він підтримується в усіх чотирьох основних браузерах, немає жодних причин ним не користуватися.

  ###########################################################################
  # Takeaways
  ###########################################################################

  - key: forms.forms_features.takeaway.html2025
    t: >
      Несподівано, але `<input type="color"/>` став найуживанішою функцією, пов'язаною з формами, цього року: про її використання повідомили **41,8%** респондентів.


      А от якщо дивитися на позитивне ставлення, рейтинг очолюють базові будівельні блоки інтерфейсу — автозаповнення (`<datalist>`) і випадні списки (Customizable Select), — що показує: розробники цінують функції, які можна кастомізувати й підлаштувати під свої потреби.

  - key: forms.forms_pain_points.takeaway.html2025
    t: >
      **Стилізація та кастомізація** типових елементів керування формами лишається великим каменем спотикання: майже **половина** проблем стосується саме цього.


      **Валідація форм** також є проблемою, особливо коли йдеться про складніші сценарії — як-от перевірка значення одного поля на основі іншого.

  - key: graphics_multimedia.graphics_multimedia_features.takeaway.html2025
    t: "**JPEG XL** і **ctx.drawElement()** — дві нові функції, що зібрали найбільше позитивних відгуків, тоді як складніші сфери на кшталт API доповненої чи розширеної реальності набрали менше — що вкотре показує: розробників передусім цікавлять примітиви, які полегшують їхню щоденну роботу."

  - key: graphics_multimedia.graphics_pain_points.takeaway.html2025
    t: "SVG завжди був темною конячкою вебу: хронічно занедбаний виробниками браузерів, але використовуваний майже на кожному сайті. Тож не дивно, що він домінує тут — на нього припадає чверть усіх проблем."

  - key: content.content_features.takeaway.html2025
    t: >
      І найбільш, і найменш улюблені функції виявилися пов'язаними з безпекою: **Sanitizer API** зібрав найбільше позитивних відгуків, тоді як **Content-Security Policy** очолила список розчарувань.


      Цей контраст показує, що механізми безпеки, які зменшують тертя й чисто вбудовуються в наявні робочі процеси, сприймаються прихильно, тоді як ті, що нав'язують жорсткі політики, вимагають прискіпливого налаштування або ламають раніше робочий код, здатні викликати спротив.

  - key: content.content_pain_points.takeaway.html2025
    t: "Дані малюють дуже чітку картину: найгостріша проблема вмісту — це **повторне використання HTML**, як між сторінками, так і в межах однієї сторінки. Хоча це вже можливо через інструменти збірки та компонентні фреймворки для клієнтської частини, схоже, існує великий попит на нативну функцію платформи."

  - key: interactivity.interactivity_features.takeaway.html2025
    t: Існує величезний попит на прості, але кастомізовані декларативні примітиви для типових речей — про що свідчить велика частка позитивного ставлення до кожної функції HTML у цій категорії.

  - key: interactivity.interactivity_pain_points.takeaway.html2025
    t: "Велика частка згаданих тут проблем із підтримуванням у браузерах надсилає чіткий сигнал: «ми любимо всі ці нові функції, які ви нам дали, — а тепер зробіть, щоб вони працювали всюди, щоб ми справді могли ними користуватися!»."

  - key: performance.performance_features.takeaway.html2025
    t: "Сигнал гучний і чіткий: DX у `srcset` і `sizes` варто покращити! Обидва краї спектра крутяться навколо них: сам `srcset`/`sizes` очолює список розчарувань, а `sizes=\"auto`  — найулюбленіша функція, бо саме вона полегшує частину цього болю."

  - key: performance.performance_pain_points.takeaway.html2025
    t: Увесь сенс вебу — дати людям доступ до віддаленого вмісту. З огляду на це трохи дивно, що **завантаження** цих даних так часто лишається другорядним, і за останні 30 років прогресу майже немає — хіба що анімації спінерів стали трохи приємнішими.

  - key: web_components.web_components_features.takeaway.html2025
    t: "Ми знову бачимо перевагу декларативних рішень: **декларативні власні елементи** очолюють діаграму ставлення."

  - key: web_components.web_components_pain_points.takeaway.html2025
    t: "Ми знаємо, що **розширення вбудованих елементів** — давно очікувана функція, і ці результати це підтверджують: це головна конкретна проблема тут (після абстрактніших — складності, залежності від JS і доступності)."

  - key: web_components.web_components_other_pain_points.takeaway.html2025
    t: "Порівняно з попередніми роками теми лишаються ті самі: високе когнітивне навантаження, програш у порівнянні з компонентами фреймворків і Shadow DOM, який радше проблема, ніж рішення."

  - key: system_capabilities.system_capabilities_features.takeaway.html2025
    t: >
      Відкриття та збереження файлу — одна з найбазовіших можливостей застосунку, і все ж донедавна вона була недосяжною для вебзастосунків — доки не з'явився **File System Access API**. Тож не дивно, що саме він очолив діаграму позитивного ставлення.


      З іншого боку, апаратні API на кшталт **WebUSB**, **Web Bluetooth** чи **WebNFC** зібрали найменше зацікавлення, вкотре підтверджуючи: найбільше цікавлять ті функції, які розв'язують базові, поширені проблеми.

  - key: system_capabilities.system_capabilities_pain_points.takeaway.html2025
    t: "Дані малюють дуже яскраву картину: головна проблема тут — не ергономіка й не обмеження, а **підтримування в браузерах**, а конкретніше — певний виробник, якого багато розробників вважають таким, що гальмує розвиток вебплатформи."

  # a11y

  - key: accessibility.accessibility_features.takeaway.html2025
    t: "**Елементи-орієнтири** (`<main>`, `<nav>` тощо) не надто нові чи захопливі, але вони лишаються основою вебдоступності."

  - key: accessibility.accessibility_pain_points.takeaway.html2025
    t: "Хоча в доступності є технічні прогалини (наприклад, ARIA між кореневими вузлами), щоразу, коли ми про це запитуємо, повторюється одна тема: головні проблеми пов'язані з *людьми* — список очолюють пріоритети на робочому місці, освіта та когнітивне навантаження."

  - key: accessibility.accessibility_techniques.takeaway.html2025
    t: Хоча альтернативний текст чи правильна ієрархія заголовків стали другою натурою для більшості розробників клієнтської частини, новіші засоби на кшталт набору медіазапитів `prefers-` ще не стали по-справжньому загальновживаними.

  - key: accessibility.accessibility_disabilities.takeaway.html2025
    t: Приємно бачити, що окрім користувачів із порушеннями зору, порівняно з минулим роком більше розробників враховують також нетипове сприйняття кольору та порушення рухливості.

  - key: accessibility.accessibility_screenreaders.takeaway.html2025
    t: Знову ж таки, легкодоступні інструменти на кшталт VoiceOver чи Chrome DevTools перемагають спеціалізованіші варіанти. Хоча багато розробників досі не користуються жодними програмами читання з екрана (зауважте також, що 39% респондентів зовсім пропустили це запитання).

  - key: accessibility.accessibility_tools.takeaway.html2025
    t: Порівняно з торішніми результатами використання браузерних devtools різко зросло, і вони обійшли Lighthouse, ставши головним інструментом тестування доступності.

  # usage
  - key: usage.html_interoperability_features.takeaway.html2025
    t: "Між станом вебплатформи та її реальним впровадженням завжди є певна затримка, тож не дивно, що **Popover API** досі очолює рейтинг. Але не помиліться: ця функція тепер офіційно має статус Baseline «Newly Available», а отже, користуватися нею в різних браузерах надалі буде значно простіше."

  - key: usage.html_functionality_features.takeaway.html2025
    t: Елементи керування формами та інші інтерактивні елементи знову сприймаються як найбільш обмежувальні. Тепер, коли питання кастомізованого select закрито, схоже, наступною метою мають стати засоби вибору дати.

  - key: usage.html_missing_elements.takeaway.html2025
    t: >
      Цього року **datatable** знову є найбільш затребуваним новим елементом. Хоча вбудовані фільтрування, сортування, пошук тощо були б, безумовно, до речі, не схоже, що це стане реальністю найближчим часом.


      З іншого боку, є поступ в інших давно очікуваних функціях — як-от нативний елемент **switch**, що й пояснює його падіння в рейтингу.

  - key: usage.html_styling_issues.takeaway.html2025
    t: Не дивно, що поля форм очолюють список найважчих для стилізації елементів. На щастя, [кастомізовані елементи select](https://developer.chrome.com/blog/a-customizable-select) уже в розробці, хоча [підтримування браузерами](https://web-platform-dx.github.io/web-features-explorer/features/customizable-select/) усе ще відстає.

  - key: usage.component_strategies.takeaway.html2025
    t: Важко заперечити, що JavaScript-компоненти стали домінантною парадигмою побудови інтерфейсів у вебі. І так, мати справу з усіма цими конкурентними фреймворками для клієнтської частини буває безладно — але це знайомий нам безлад (а може, навіть улюблений?), і саме тому вебкомпонентам важко піднятися вище четвертого місця.

  - key: usage.design_system_strategies.takeaway.html2025
    t: Дизайн-системи стали вимогою для більшості великих проєктів, і це відображено в популярності всіх цих різних підходів.

  - key: usage.html_css_js_balance.takeaway.html2025
    t: Як показано на діаграмі «Стратегії компонентів» вище, JavaScript є фактичним носієм для великої частини HTML-коду, який ми створюємо. Це й пояснює, чому ми витрачаємо стільки часу на його написання!

  - key: usage.what_do_you_use_html_for.takeaway.html2025
    t: Хоча пересічний респондент опитування працює переважно над динамічними вебзастосунками, багато з нас також витрачають час на створення блогів чи інших насичених текстом сайтів — що повертає нас до коренів HTML як мови, орієнтованої на документи.

  - key: usage.html_pain_points_freeform.takeaway.html2025
    t: >
      Якщо дивитися на проблеми вебплатформи загалом, вирізняється підтримування в браузерах — особливо коли йдеться про екосистему Apple.


      Як наслідок, спільнотні ініціативи на кшталт хештегу [#AppleBrowserBan](https://open-web-advocacy.org/apple-browser-ban/) набирають обертів, а з боку виробників [Interop](https://web.dev/blog/interop-2025) щороку зрушує справу в правильному напрямі.

  # opinions

  - key: opinions.accessibility_is_valued.takeaway.html2025
    t: "З огляду на те, що брак підтримки з боку роботодавця часто називають перешкодою для належних практик доступності, приємно бачити, що принаймні серед респондентів опитування справи, схоже, покращуються: обидва стовпчики «погоджуюсь» зросли порівняно з минулим роком."

  - key: opinions.validation_is_important.takeaway.html2025
    t: Про валідацію HTML легко забути в хаосі сучасної веброзробки. Але респонденти погоджуються, що вона лишається важливою частиною процесу.

  - key: opinions.keeping_informed_is_challenging.takeaway.html2025
    t: Попри чудові ініціативи на кшталт [Baseline](https://web-platform-dx.github.io/web-features/), [встигати за вебплатформою](https://css-tricks.com/how-to-keep-up-with-new-css-features/) лишається непросто. Сподіваємось, це опитування хоч трохи допоможе!

  - key: opinions.keeping_informed_is_challenging.takeaway.html2025
    t: Попри чудові ініціативи на кшталт [Baseline](https://web-platform-dx.github.io/web-features/), [встигати за вебплатформою](https://css-tricks.com/how-to-keep-up-with-new-css-features/) лишається непросто. Сподіваємось, це опитування хоч трохи допоможе!

  - key: opinions.browser_interoperability_is_obstacle.takeaway.html2025
    t: >
      Бути виробником браузера у 2025 році нелегко. Розробники скаржаться на застій платформи — тож ви впроваджуєте нові функції та API… і тепер розробники скаржаться на брак підтримування в різних браузерах!


      Саме тому [Interop](https://web.dev/blog/interop-2025) за останні кілька років став ключовою частиною процесу. Він дає виробникам браузерів змогу узгоджувати сумісність функцій і не допускати, щоб уся їхня важка праця марнувалася через погану сумісність.

  - key: opinions.browser_interoperability_pace.takeaway.html2025
    t: "Результати цих зусиль щодо сумісності відображені на цій діаграмі: **75%** респондентів погоджуються, що справи рухаються швидше, ніж раніше."

  - key: opinions.web_platform_right_direction.takeaway.html2025
    t: Так само **77%** респондентів позитивно оцінюють загальний напрям розвитку вебплатформи.

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.html2025.lea_verou.name
    t: Dr Lea Verou
  - key: conclusion.html2025.lea_verou.bio
    t: Спікерка, авторка, відзначена нагородами консультантка з вебархітектури
  - key: conclusion.html2025.lea_verou
    t: >
      Ми часто очікуємо, що найяскравіші функції привертатимуть найбільше уваги розробників. Щось на кшталт API на базі ШІ, 3D/XR/AR чи апаратних API. Та рік за роком нагору підіймається щось геть не ефектне. Майже… буденне: випадні списки. Комбобокси. Поповери. Діалоги. Валідація форм. Завантаження та збереження файлів. Шаблонізація. Безпечне відображення створеного користувачами вмісту. Іконки.

      ### Зробити API придатними до використання

      «Але ж багато з цього вже існує!» — заперечите ви. Так, існує — але коли вбудований інтерфейс не можна кастомізувати чи стилізувати, він фактично непридатний. Розробники все одно змушені створювати його заново.


      Щойно це усвідомлюєш, стає зрозумілою більшість результатів опитування. Стає зрозуміло, чому **Customizable Select** очолив рейтинги. Чому низькорівневі примітиви на кшталт поповерів та інвокерів сприймаються так добре. Чому **SVG** і **малювання HTML на canvas** посіли місця значно вище за AR/VR. І навіть чому **розширення вбудованих елементів** постало такою серйозною проблемою вебкомпонентів.


      Зрештою: скільки разів можна перебудовувати кнопку чи випадний список, поки не збожеволієш? І наскільки ви впевнені, що зробили це правильно?


      Як наслідок, побудова професійних інтерактивних інтерфейсів досі потребує зшивання докупи численних сторонніх рішень — навіть для того, що на пропрієтарних платформах є рутиною.

      ### Зміни, що відстають

      Це відкриття не нове. Ще в [першому «Стані HTML»](https://2023.stateofhtml.com/) ми бачили, наскільки критичними є стилізація й кастомізація, особливо навколо форм. Цьогорічний глибший аналіз підтверджує, що нічого не змінилося — ба більше, сигнал став гучнішим.


      Але дещо *таки* змінилося на краще! Функції, які обговорювалися у 2023 році, тепер випущені в основних браузерах. Інші, що тоді були непрактичними — як-от **Popover API**, — тепер підтримуються повсюдно.


      І все ж Popover досі очолює скарги на підтримування в браузерах. Чому? Хоча темп реалізації пришвидшився, колективне сприйняття відстає. Розробникам тепер потрібно більше часу, щоб повірити в підтримку, ніж браузерам — щоб її випустити!

      ### Вплив LLM

      Зростання обсягу коду, згенерованого ШІ, є одним із чинників. LLM напрочуд добре обізнані із сучасними функціями вебплатформи й *могли* б допомогти спільноті рухатися вперед, але надто консервативні в тому, що радять. На практиці це може навіть *гальмувати* впровадження! Як розв'язати це в масштабі — відкрите питання. Тим часом явні вказівки щодо підтримування браузерами таки допомагають; і хтозна, якщо так робитиме досить розробників, проблема може навіть розв'язатися сама.

      ### Погляд у майбутнє

      Якщо дивитися вперед, майбутнє видається світлим. Над багатьма з окреслених проблем активно працюють, а подекуди вони вже виходять у релізи. Навіть розширювані вбудовані елементи, які раніше вважали глухим кутом, мають потенційний поступ завдяки ранній роботі над власними атрибутами.


      Усі ці примітиви вказують в одному напрямі: вебплатформа неухильно стає гнучкішою, виразнішою й ближчою до того, як розробники насправді будують інтерфейси.


      Поступ у вебі рідко буває драматичним, але він накопичувальний. Кожен новий примітив зменшує потребу в обхідних шляхах, бібліотеках і крихких хаках. А коли ці основи стануть на місце, вплив відчують усюди.

  - key: about.content.html2025
    t: |
      Опитування "Стан HTML 2025" тривало з 19 липня до 1 вересня 2025 року та зібрало 6223 відповіді. 

      Опитування загалом розробляла [Lea Verou](https://lea.verou.me/), план опитування спільно обговорювався [на платформі GitHub](https://github.com/Devographics/surveys/issues/253) 

      Інфраструктурою опитувань керує [Sacha Greif](https://sachagreif.com/) з допомогою запрошених експертів та учасників проєктів із відкритим програмним кодом. 

      Цьогорічні логотип і футболку розробив [Christopher Kirk-Nielsen](http://chriskirknielsen.com/). 

      ### Цілі опитування 

      Це опитування було створено для визначення майбутніх тенденцій в екосистемі веброзробки, щоб допомогти розробникам здійснити вибір з-поміж наявних технологій. 

      Так опитування зосереджено більше на передбаченні того, що станеться протягом наступних кількох років, ніж на аналізі того, що популярно саме зараз, — ось чому деякі функції чи технології іноді можуть не згадуватися попри широке впровадження. 

      Його також слід сприймати як **знімок певної підмножини розробників у певний момент часу**, а не промовистий опис від імені всієї екосистеми. 

      Опитування було повністю відкрите та доступне онлайн, респонденти жодним чином не відфільтровувалися та не відбиралися. 

      ### Фінансування проєкту 

      Цей проєкт фінансується з різних джерел: 

      - **Продаж футболок**. 

      - **Посилання від спонсорів**: посилання на рекомендовані джерела у нижній частині кожної сторінки надають наші партнери [Frontend Masters](https://frontendmasters.com/). 

      - **Інше**: [Google](https://www.google.com/) і [TokyoDev](https://www.tokyodev.com/) також профінансували роботу над опитуванням. 

      ### Технічний огляд 

      Більш детальний технічний огляд того, як проводяться опитування, [тут](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a).
