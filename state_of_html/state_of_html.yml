  # design_system_strategies
  - key: usage.design_system_strategies
    t: Дизайн-системи

  - key: usage.design_system_strategies.question
    t: Чи використовуєте ви якусь із наведених нижче стратегій для дизайн-систем, щоб мати консистентний та узгоджений UI?

  - key: options.design_system_strategies.elements_components
    t: Елементи/компоненти
  - key: options.design_system_strategies.elements_components.description
    t: |
      Бібліотека багаторазово використовуваних будівельних блоків, як-от кнопки або випадні меню, реалізованих будь-якою технологією (наприклад, React, вебкомпоненти тощо).

  - key: options.design_system_strategies.design_tokens
    t: Дизайн-токени
  - key: options.design_system_strategies.design_tokens.description
    t: |
      Атомарні змінні, наприклад, для кольорів, інтервалів і типографіки, як-от `--color-accent-dark`, `--font-heading` тощо.

  - key: options.design_system_strategies.utilities
    t: Допоміжні класи
  - key: options.design_system_strategies.utilities.description
    t: |
      Низькорівневі CSS-класи, що застосовують один певний стиль або поведінку, наприклад, .`visually-hidden`, `.grid-2x2`, `.text-center` тощо.

  - key: options.design_system_strategies.guidelines
    t: Керівні принципи
  - key: options.design_system_strategies.guidelines.description
    t: |
      Стандарти та найкращі практики для підтримання узгодженості та забезпечення досягнення певних цілей (доступність, зручність використання тощо).

  - key: options.design_system_strategies.patterns
    t: Шаблони
  - key: options.design_system_strategies.patterns.description
    t: |
      Копіювано-вставні композиції вищого рівня всіх перерахованих вище елементів, які вирішують поширені проблеми UI/UX, як-от панелі навігації або навіть цілі адаптивні макети сторінок.

