  # FAQ

  - key: faq.who_should_take_survey_devs
    t: Хто може взяти участь у цьому опитуванні?
  - key: faq.who_should_take_survey_devs.description
    t: >
      Це відкрите опитування для всіх, хто працює чи вчиться як розробник, програміст чи інженер, незалежно від рівня досвіду чи походження!

  - key: faq.survey_goals_devs
    t: Яка мета цього опитування
  - key: faq.survey_goals_devs.description
    t: >
      Мета опитування — отримати повніше уявлення про екосистему розробників за межами суто технічних тенденцій.

  - key: faq.data_used_devs
    t: Як ці дані будуть використані?
  - key: faq.data_used_devs.description
    t: >
      Зібрані дані використовуватимуться для публікації на загал онлайн-звіту. Також весь набір даних також буде доступний безкоштовно [на вимогу](https://discord.gg/2E7bbgnrJJ).

